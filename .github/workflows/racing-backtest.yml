name: Racing backtest

# Runs the 3-month backtest on GitHub's network (Betfair's SP files) and commits the report next to the script.
on:
  push:
    paths: ['racing/backtest/backtest.py', '.github/workflows/racing-backtest.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backtest
        # Last three full months of racing: train on the first two, test once on the third.
        run: python racing/backtest/backtest.py 2026-07-29 2026-10-28 2026-09-29 --out racing/backtest/RESULTS.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/backtest/RESULTS.md
          git diff --cached --quiet || (git commit -m "Update racing backtest results" && git push)
