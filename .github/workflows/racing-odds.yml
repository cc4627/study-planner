name: Racing price rules

# Tests "only back the picks within a price range" on the year of results the backtest and confirmation
# runs already collected (restored from the Actions cache, nothing re-downloaded), then commits
# racing/backtest/ODDS.md. Paper points only.
on:
  push:
    paths: ['racing/backtest/odds.py', '.github/workflows/racing-odds.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: racing-odds

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      # One restore per month block, under the keys the collect jobs saved them with. The key ends in a
      # hash of racing/sl.py, which has changed since, so match on the prefix and take the latest.
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2025-11-01.jsonl.gz
          key: sl-results-v1-2025-11-01-2026-01-31-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2025-11-01-2026-01-31-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2026-02-01.jsonl.gz
          key: sl-results-v1-2026-02-01-2026-04-30-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2026-02-01-2026-04-30-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2026-05-01.jsonl.gz
          key: sl-results-v1-2026-05-01-2026-07-28-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2026-05-01-2026-07-28-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2026-07-29.jsonl.gz
          key: sl-results-v1-2026-07-29-2026-08-28-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2026-07-29-2026-08-28-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2026-08-29.jsonl.gz
          key: sl-results-v1-2026-08-29-2026-09-28-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2026-08-29-2026-09-28-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: racing/backtest/data/2026-09-29.jsonl.gz
          key: sl-results-v1-2026-09-29-2026-10-28-${{ hashFiles('racing/sl.py') }}
          restore-keys: sl-results-v1-2026-09-29-2026-10-28-
          fail-on-cache-miss: true
      - name: Analyse
        run: |
          ls -l racing/backtest/data
          python racing/backtest/odds.py racing/backtest/data --out racing/backtest/ODDS.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/backtest/ODDS.md
          git diff --cached --quiet || (git commit -m "Update racing price-rule results" && git pull --rebase && git push)
