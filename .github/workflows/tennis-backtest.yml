name: Tennis backtest

# Rebuilds Elo ratings from every ATP and WTA singles result since January 2024 (ESPN's free scores feed;
# past days kept in the Actions cache) and checks every pick since July 2025, then commits tennis/BACKTEST.md.
on:
  push:
    paths: ['tennis/backtest.py', 'tennis/elo.py', 'tennis/espn.py', 'tennis/games.py', '.github/workflows/tennis-backtest.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: tennis-backtest

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:  # the branch tip, so a run queued behind another sees its push
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: tennis/.cache
          key: tennis-espn-v1-${{ github.run_id }}
          restore-keys: tennis-espn-v1-
      - name: Backtest
        run: python tennis/backtest.py tennis/.cache --out tennis/BACKTEST.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add tennis/BACKTEST.md
          git diff --cached --quiet || (git commit -m "Update tennis backtest" && git pull --rebase && git push)
