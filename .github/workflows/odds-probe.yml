name: Tennis odds probe

# Temporary: reads tennisexplorer.com results pages to find the match odds for the 5 Nov picks.
on:
  push:
    paths: ['.github/workflows/odds-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python
        run: |
          import re, html, time, urllib.request
          UA = {'User-Agent': 'study-planner/1.0 (+https://github.com/cc4627/study-planner)'}
          def get(url):
              time.sleep(1)
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')
          pairs = [('Wang Xin', 'Ruzic'), ('Shubladze', 'Pridankina'), ('Sonmez', 'Stojsavljevic'), ('Kroitor', 'Zaytseva'),
                   ('Blinkova', 'Li Z'), ('Linette', 'Uchijima'), ('Paul T', 'Halys'), ('Alcaraz', 'Berrettini M')]
          cells = lambda r: [html.unescape(x.strip()) for x in re.sub(r'<[^>]+>', '|', r).split('|') if x.strip()]
          found = {}
          for day in ('04', '05', '06'):
              page = get(f'https://www.tennisexplorer.com/results/?type=all&year=2026&month=11&day={day}')
              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', page, re.S)
              for i in range(len(rows) - 1):
                  a, b = ' '.join(cells(rows[i])), ' '.join(cells(rows[i + 1]))
                  for p, q in pairs:
                      if (p in a and q in b) or (q in a and p in b):
                          odds = re.findall(r'\b\d{1,2}\.\d{2}\b', a)
                          link = re.search(r'href="(/match-detail/\?id=\d+)"', rows[i] + rows[i + 1])
                          found[(p, q)] = (day, a[:120], b[:80], odds[-2:], link.group(1) if link else None)
          for p, q in pairs:
              print(p, 'v', q, '->', found.get((p, q), 'not found'))
          # games over/under lines on the detail pages
          for (p, q), (day, a, b, odds, link) in found.items():
              if not link:
                  continue
              t = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', get('https://www.tennisexplorer.com' + link))))
              i = t.find('Total Over Under')
              print('TOTALS', p, q, t[i:i + 700] if i >= 0 else 'none')
