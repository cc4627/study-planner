name: Tennis odds probe

# Temporary: total-games prices for the 5 Nov picks from tennisexplorer.com match pages.
on:
  push:
    paths: ['.github/workflows/odds-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python
        run: |
          import re, html, time, urllib.request
          UA = {'User-Agent': 'study-planner/1.0 (+https://github.com/cc4627/study-planner)'}
          def get(url):
              time.sleep(1)
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')
          pages = {'Shubladze': ('3369403', 21.5), 'Sonmez': ('3370061', 21.5), 'Kroitor': ('3370217', 21.5),
                   'Blinkova': ('3369747', 21.5), 'Linette': ('3369735', 21.5), 'Paul': ('3370211', 22.5)}
          for who, (mid, line) in pages.items():
              t = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', get(f'https://www.tennisexplorer.com/match-detail/?id={mid}'))))
              key = f'Over/Under {line:g} games'
              i = t.find(key)
              seg = t[i:i + 600] if i >= 0 else ''
              m = re.search(r'Average odds ' + re.escape(f'{line:g}') + r' (\d+\.\d+) (\d+\.\d+)', seg)
              b = re.search(r'Total Over Under (\S+(?: \S+)?) ' + re.escape(f'{line:g}') + r' (\d+\.\d+) (\d+\.\d+)', seg)
              print(who, line, 'average over/under:', m.groups() if m else None, '| first bookmaker:', b.groups() if b else None)
              if not seg:
                  lines = sorted(set(re.findall(r'Over/Under (\d+\.?\d*) games', t)), key=float)
                  print('   lines on page:', lines)
          for day in ('04', '05'):
              page = get(f'https://www.tennisexplorer.com/results/?type=all&year=2026&month=11&day={day}')
              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', page, re.S)
              cells = lambda r: ' '.join(html.unescape(x.strip()) for x in re.sub(r'<[^>]+>', '|', r).split('|') if x.strip())
              for i in range(len(rows) - 1):
                  a, b2 = cells(rows[i]), cells(rows[i + 1])
                  if ('Ruzic' in a or 'Ruzic' in b2) and ('Wang' in a or 'Wang' in b2):
                      print('Wang/Ruzic', day, a[:120], '|', b2[:80])
