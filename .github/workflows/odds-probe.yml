name: Soccer odds probe

# Temporary: does betexplorer.com list corners or cards prices for football matches?
on:
  push:
    paths: ['.github/workflows/odds-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python
        run: |
          import re, time, urllib.request
          UA = {'User-Agent': 'study-planner/1.0 (+https://github.com/cc4627/study-planner)'}
          def get(url):
              time.sleep(1.5)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return str(e), ''
          s, robots = get('https://www.betexplorer.com/robots.txt'); print('robots', s); print(robots[:1500])
          s, page = get('https://www.betexplorer.com/football/europe/europa-league/'); print('league page', s, len(page))
          links = sorted(set(re.findall(r'href="(/football/europe/europa-league/[a-z0-9-]+/[A-Za-z0-9]{8}/)"', page)))
          print('match links', len(links), links[:5])
          if links:
              s, m = get('https://www.betexplorer.com' + links[0]); print('match page', links[0], s, len(m))
              tabs = sorted(set(re.findall(r'data-bettype="?([A-Za-z0-9_-]+)', m)) | set(re.findall(r'#(1x2|ou|ah|ha|dc|bts|ht-ft|cs|dnb|eh)\b', m)))
              print('bet types:', tabs)
              for k in ('orner', 'ards', 'ooking'):
                  i = m.find(k); print(k, '->', m[max(0, i - 150):i + 150].replace('\n', ' ') if i >= 0 else 'not on page')
