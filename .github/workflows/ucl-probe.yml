name: UCL data probe

# Temporary: what ESPN's free soccer feed carries for European competitions (fixtures, odds, match stats).
on:
  push:
    paths: ['.github/workflows/ucl-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python
        run: |
          import json, urllib.request, datetime
          UA = {'User-Agent': 'study-planner/1.0 (+https://github.com/cc4627/study-planner)'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return json.loads(r.read())
          today = datetime.date.today()
          for slug in ('uefa.champions', 'uefa.europa', 'uefa.europa.conf'):
              for d in (today - datetime.timedelta(1), today, today + datetime.timedelta(1)):
                  try:
                      j = get(f'https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard?dates={d:%Y%m%d}')
                  except Exception as e:
                      print(slug, d, 'ERR', e); continue
                  ev = j.get('events', [])
                  print(f'\n== {slug} {d}: {len(ev)} events')
                  for e in ev[:2]:
                      c = e['competitions'][0]
                      st = (c.get('status') or {}).get('type') or {}
                      print(' ', e.get('name'), e.get('date'), st.get('state'), 'comp keys:', sorted(c.keys()))
                      for t in c.get('competitors', []):
                          print('    ', t.get('homeAway'), (t.get('team') or {}).get('displayName'), t.get('score'),
                                [(x.get('name'), x.get('displayValue')) for x in t.get('statistics', [])])
                      for o in (c.get('odds') or [])[:1]:
                          print('    odds:', json.dumps(o)[:900])
          # one finished match summary, for stat names
          j = get(f'https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard?dates={today - datetime.timedelta(1):%Y%m%d}')
          ev = [e for e in j.get('events', []) if (e['competitions'][0].get('status') or {}).get('type', {}).get('state') == 'post']
          if ev:
              s = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/summary?event={ev[0]['id']}")
              for t in (s.get('boxscore') or {}).get('teams', []):
                  print('summary', (t.get('team') or {}).get('displayName'), [(x.get('name'), x.get('displayValue')) for x in t.get('statistics', [])])
              print('summary odds keys:', [k for k in s.keys()])
