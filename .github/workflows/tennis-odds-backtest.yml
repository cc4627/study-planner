name: Tennis odds backtest

# Settles a year of Elo picks at the prices tennisexplorer.com lists on its results pages and commits
# tennis/ODDS.md. On demand only: a first run reads about 700 pages from tennisexplorer (2 s apart; its
# robots.txt allows them), kept in their own cache so a rerun reads nothing twice. Paper only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: tennis-odds-backtest

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:  # the branch tip, so a run queued behind another sees its push
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4  # ESPN's past days, shared with the other tennis jobs (read only here)
        with:
          path: tennis/.cache
          key: tennis-espn-v1-none
          restore-keys: tennis-espn-v1-
      - uses: actions/cache/restore@v4
        with:
          path: tennis/.te-cache
          key: tennis-te-v1-${{ github.run_id }}
          restore-keys: tennis-te-v1-
      - name: Backtest
        run: python tennis/odds_backtest.py tennis/.cache --te tennis/.te-cache --out tennis/ODDS.md
      - uses: actions/cache/save@v4  # even if the run fails, so the pages already read aren't read again
        if: always()
        with:
          path: tennis/.te-cache
          key: tennis-te-v1-${{ github.run_id }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add tennis/ODDS.md
          git diff --cached --quiet || (git commit -m "Update tennis odds backtest" && git pull --rebase && git push)
