name: Racing settle

# Each evening, settles the day's paper-tracked picks at SP from Sporting Life's free results
# (read-only, no bets) and commits racing/track/results.csv and SUMMARY.md.
# Scheduled runs only happen from the default branch.
on:
  schedule:
    - cron: '37 22 * * *'  # 22:37 UTC, after the last evening meeting
  workflow_dispatch:

permissions:
  contents: write

concurrency: racing-picks

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Settle
        run: python racing/track/settle.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/track
          git diff --cached --quiet || (git commit -m "Settle racing paper-tracking" && git pull --rebase && git push)
