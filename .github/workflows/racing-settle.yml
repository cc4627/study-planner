name: Racing settle

# Each evening, settles the day's paper-tracked picks at SP from Sporting Life's free results
# (read-only, no bets), commits racing/track/results.csv and SUMMARY.md, and adds each pick's finishing
# position to racing/picks/DATE.json.
# Scheduled runs only happen from the default branch.
on:
  schedule:
    - cron: '37 22 * * *'  # 22:37 UTC, after the last evening meeting
  workflow_dispatch:
  push:  # also settle straight away when the settling code changes
    paths: ['racing/track/settle.py', '.github/workflows/racing-settle.yml']

permissions:
  contents: write

concurrency: racing-picks

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:  # the branch tip, not the triggering commit: a run queued behind another must see its push
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Settle
        run: python racing/track/settle.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/track racing/picks
          git diff --cached --quiet || (git commit -m "Settle racing paper-tracking" && git pull --rebase && git push)
