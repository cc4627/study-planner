name: Racing source probe

# Temporary: checks which public racecard sites are reachable from GitHub's runners.
on:
  push:
    paths: ['racing/probe/**', '.github/workflows/racing-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 racing/probe/probe.py
