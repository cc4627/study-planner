name: Sports data probe

# Temporary: checks which free soccer and tennis data sources GitHub's runners can read. Removed once the
# real jobs are in place.
on:
  push:
    paths: ['.github/workflows/sports-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Probe
        shell: python
        run: |
          import csv, io, json, urllib.request, datetime, traceback
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) study-planner/1.0', 'Accept': '*/*'}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read()
          def section(name, fn):
              print(f'\n===== {name}', flush=True)
              try:
                  fn()
              except Exception:
                  traceback.print_exc()
          today = datetime.date.today()

          def sackmann():
              for tour in ('atp', 'wta'):
                  for y in (2024, 2025, 2026):
                      url = f'https://raw.githubusercontent.com/JeffSackmann/tennis_{tour}/master/{tour}_matches_{y}.csv'
                      try:
                          s_, b = get(url)
                          lines = b.decode('utf-8', 'replace').splitlines()
                          print(url.split('/')[-1], s_, len(lines) - 1, 'matches; last:', lines[-1][:120])
                          if y == 2024 and tour == 'atp':
                              print(' header:', lines[0])
                      except Exception as e:
                          print(url.split('/')[-1], 'ERR', e)
          section('tennis history (Sackmann on GitHub)', sackmann)

          def espn_detail():
              s_, b = get(f'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates={today:%Y%m%d}')
              j = json.loads(b)
              e = j['events'][0]
              print('event keys:', sorted(e.keys()))
              print('event extras:', {k: e.get(k) for k in ('date', 'endDate', 'venue', 'major', 'season', 'shortName') if k in e})
              g = [g for g in e['groupings'] if (g.get('grouping') or {}).get('slug', '').endswith('singles')][0]
              comps = g['competitions']
              states = {}
              for c in comps:
                  st = (c.get('status') or {}).get('type', {}).get('state'); states[st] = states.get(st, 0) + 1
              print('states:', states)
              pre = [c for c in comps if (c.get('status') or {}).get('type', {}).get('state') != 'post'][:3]
              for c in (pre or comps[-2:]):
                  print(' comp keys:', sorted(c.keys()))
                  print(' ', c.get('date'), c.get('startDate'), (c.get('round') or {}).get('displayName'), (c.get('status') or {}).get('type'))
                  for x in c.get('competitors', []):
                      a = x.get('athlete') if isinstance(x.get('athlete'), dict) else {}
                      print('    ', sorted(x.keys()), a.get('displayName'), a.get('id') or x.get('id'), x.get('winner'), x.get('linescores'))
              for d in ('20260115', '20260601', '20260705'):
                  s_, b = get(f'https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard?dates={d}')
                  j = json.loads(b)
                  print(d, [(ev.get('name'), ev.get('date'), sum(len(g.get('competitions', [])) for g in ev.get('groupings', []))) for ev in j.get('events', [])])
          section('ESPN tennis detail', espn_detail)
