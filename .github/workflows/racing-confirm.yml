name: Racing confirmation

# Runs the frozen model and rule (racing/backtest/frozen.json) once over nine months the backtest never
# saw (Nov 2025 - Jul 2026), collected from Sporting Life at one request a second per job and kept in
# the Actions cache, then commits racing/backtest/CONFIRM.md.
on:
  push:
    paths: ['racing/backtest/confirm.py', 'racing/backtest/frozen.json', '.github/workflows/racing-confirm.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        part:
          - {start: '2025-11-01', end: '2026-01-31'}
          - {start: '2026-02-01', end: '2026-04-30'}
          - {start: '2026-05-01', end: '2026-07-28'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: cache
        uses: actions/cache@v4
        with:
          path: racing/backtest/data/${{ matrix.part.start }}.jsonl.gz
          key: sl-results-v1-${{ matrix.part.start }}-${{ matrix.part.end }}-${{ hashFiles('racing/sl.py') }}
      - name: Collect
        if: steps.cache.outputs.cache-hit != 'true'
        run: python racing/backtest/collect.py ${{ matrix.part.start }} ${{ matrix.part.end }} racing/backtest/data/${{ matrix.part.start }}.jsonl.gz
      - uses: actions/upload-artifact@v4
        with:
          name: old-${{ matrix.part.start }}
          path: racing/backtest/data/${{ matrix.part.start }}.jsonl.gz
          retention-days: 7

  confirm:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: old-*
          path: racing/backtest/old
          merge-multiple: true
      - name: Confirm
        run: python racing/backtest/confirm.py racing/backtest/old --out racing/backtest/CONFIRM.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/backtest/CONFIRM.md
          git diff --cached --quiet || (git commit -m "Update racing confirmation results" && git pull --rebase && git push)
