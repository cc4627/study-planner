name: Racing picks

# Each morning, reads the day's UK & Irish win markets from Betfair (read-only, no bets) and commits
# the top three per race for racing/index.html. Scheduled runs only happen from the default branch.
on:
  schedule:
    - cron: '37 9 * * *'  # 09:37 UTC = 09:37 GMT / 10:37 BST, before the first race
  workflow_dispatch:

permissions:
  contents: write

concurrency: racing-picks

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build picks
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: python racing/picks/build_picks.py
      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/picks
          git diff --cached --quiet || (git commit -m "Update racing picks" && git pull --rebase && git push)
