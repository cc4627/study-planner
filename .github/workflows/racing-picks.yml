name: Racing picks

# Reads UK & Irish racecards from Sporting Life (free, no account, read-only) and commits the top three
# per race for racing/index.html: today's races still to run, and tomorrow's. Races already off are never
# re-picked. Scheduled runs only happen from the default branch.
on:
  schedule:
    - cron: '37 9 * * *'   # 09:37 UTC = 09:37 GMT / 10:37 BST, before the first race
    - cron: '37 17 * * *'  # 17:37 UTC: tomorrow's cards, once the betting forecasts are out
  workflow_dispatch:
  push:  # also rebuild straight away when the picks code or this workflow changes
    paths: ['racing/picks/build_picks.py', '.github/workflows/racing-picks.yml']

permissions:
  contents: write

concurrency: racing-picks

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build picks
        run: python racing/picks/build_picks.py today tomorrow
      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/picks racing/track
          git diff --cached --quiet || (git commit -m "Update racing picks" && git pull --rebase && git push)
