name: Racing picks

# Reads UK & Irish racecards from Sporting Life (free, no account, read-only) and commits the top three
# per race for racing/index.html. The site shows only today's cards, so the first run is just after
# midnight UK time and a second mid-morning picks up late changes. Races already off are never re-picked.
# Scheduled runs only happen from the default branch.
on:
  schedule:
    - cron: '17 0 * * *'   # 00:17 UTC: just after midnight UK time (GMT or BST), the day's first picks
    - cron: '37 9 * * *'   # 09:37 UTC = 09:37 GMT / 10:37 BST, before the first race
  workflow_dispatch:
  push:  # also rebuild straight away when the picks code or this workflow changes
    paths: ['racing/picks/build_picks.py', '.github/workflows/racing-picks.yml']

permissions:
  contents: write

concurrency: racing-picks

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:  # the branch tip, not the triggering commit: a run queued behind another must see its push
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build picks
        run: python racing/picks/build_picks.py
      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add racing/picks racing/track
          git diff --cached --quiet || (git commit -m "Update racing picks" && git pull --rebase && git push)
