<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Racing Picks</title>
<meta name="description" content="Each day's UK and Irish races: time, course and the top three in the morning market.">
<meta name="theme-color" content="#D9EAFB">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito&display=swap">
</head>
<body>
<style>
/* Same look as the Study Week Planner: light-blue board, Calibri regular, 2px outlined boxes.
   Course chips sit in a tray on top and filter the day's races, which are cards of time, course and top three. */
:root{
  --bg:#D9EAFB; --surface:#FFFFFF; --ink:#101C26; --muted:#4F6476; --line:#BCD2E8; --edge:#7F9DBA;
  --focus:#3B4CCA;
  --c1:#3B4CCA; --c2:#B84A17; --c3:#177A4F; --c4:#8A3FA8; --c5:#0E7490; --c6:#A16207; --c7:#BE185D; --c8:#4D5B68;
  --font:'Calibri','Carlito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2133; --surface:#16293C; --ink:#E8EEF3; --muted:#9DB1C3; --line:#2B4258; --edge:#5C7A96;
    --focus:#9AA6FF;
    --c1:#9AA6FF; --c2:#FF9A68; --c3:#53C894; --c4:#D29BF0; --c5:#5CC8E0; --c6:#F2C04E; --c7:#F48FB8; --c8:#A4B2BE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2133; --surface:#16293C; --ink:#E8EEF3; --muted:#9DB1C3; --line:#2B4258; --edge:#5C7A96;
  --focus:#9AA6FF;
  --c1:#9AA6FF; --c2:#FF9A68; --c3:#53C894; --c4:#D29BF0; --c5:#5CC8E0; --c6:#F2C04E; --c7:#F48FB8; --c8:#A4B2BE;
  color-scheme:dark;
}
*{box-sizing:border-box}
*,*::before,*::after{font-weight:400!important;letter-spacing:normal!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;
}
.app{max-width:1240px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}

.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.eyebrow{font:12px/1 var(--font);text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font:clamp(26px,6vw,38px)/1.05 var(--font);text-wrap:balance}
.stat{margin:6px 0 0;font:13px/1.3 var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.navs{display:flex;gap:8px;align-items:center}
.nav{width:44px;height:44px;border-radius:10px;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;padding:0}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav:disabled{opacity:.35;cursor:default}
.pill{min-height:44px;padding:0 14px;border:2px solid var(--edge);background:var(--surface);border-radius:999px;font:12px/1 var(--font);text-transform:uppercase}

.tray{background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.hint{font:12px/1.35 var(--font);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  --k:var(--c8);
  display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 12px 6px 10px;
  border-radius:9px;border:2px solid var(--k);
  background:color-mix(in srgb,var(--k) 10%,var(--surface));font:14px/1.1 var(--font);
}
.chip em{font:11px/1 var(--font);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--k);background:color-mix(in srgb,var(--k) 24%,var(--surface))}
.chip.all{--k:var(--ink)}

.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.race{
  --k:var(--c8);
  border-radius:9px;border:2px solid var(--k);
  background:color-mix(in srgb,var(--k) 11%,var(--surface));
  padding:8px 12px 10px;display:grid;gap:6px;min-width:0;
}
.race.gone{opacity:.55}
.rh{display:flex;align-items:baseline;gap:8px;min-width:0}
.rh b{font:22px/1 var(--font);font-variant-numeric:tabular-nums}
.rh span{font:12px/1.15 var(--font);text-transform:uppercase;color:var(--k);overflow-wrap:anywhere}
.race ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.race li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;align-items:baseline;font:15px/1.3 var(--font);overflow-wrap:anywhere}
.race li i{font:12px/1 var(--font);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.race li:first-child{font-size:17px}

.empty{border:2px dashed var(--edge);border-radius:12px;padding:24px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font:18px/1.2 var(--font);margin-bottom:6px}
.foot{margin:0;text-align:center;font:12px/1.4 var(--font);color:var(--muted)}
[hidden]{display:none!important}
</style>

<main class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">UK &amp; Ireland racing</div>
      <h1 id="title">&nbsp;</h1>
      <p class="stat" id="stat"></p>
    </div>
    <div class="navs">
      <button class="pill" id="today" type="button" hidden>Today</button>
      <button class="nav" id="prev" type="button" aria-label="Previous day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="nav" id="next" type="button" aria-label="Next day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </header>

  <section class="tray" id="tray" aria-label="Courses" hidden>
    <span class="hint">Tap a course to show only its races</span>
    <div class="chips" id="chips"></div>
  </section>

  <section class="races" id="races" aria-label="Races"></section>

  <p class="foot">Top three = shortest prices on the Betfair Exchange at about 10am. A guide, not a tip; no bets are placed.
    Help: <a href="https://www.begambleaware.org" target="_blank" rel="noopener">BeGambleAware</a> ·
    <a href="https://www.gamstop.co.uk" target="_blank" rel="noopener">GAMSTOP</a></p>
</main>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var fromKey=function(k){var p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var getJSON=function(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});};

var dates=[],cur=null,day=null,course=null;
var today=keyOf(new Date());


function nowLondon(){
  try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());}
  catch(e){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
}

function render(){
  var i=dates.indexOf(cur);
  $('#prev').disabled=i<=0;
  $('#next').disabled=i<0||i>=dates.length-1;
  $('#today').hidden=cur===today||dates.indexOf(today)<0;
  $('#title').textContent=cur?fromKey(cur).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}):'Racing picks';
  $('#eyebrow').textContent=cur===today?'Today · UK & Ireland racing':'UK & Ireland racing';

  var box=$('#races');
  if(!day||!day.races||!day.races.length){
    $('#tray').hidden=true;$('#stat').textContent='';
    box.innerHTML='<div class="empty" style="grid-column:1/-1"><b>'+(dates.length?'No races on this day':'No picks yet')+'</b>'+
      (dates.length?'Use the arrows to see another day.':'Picks appear here each morning, at about 10am, once the daily job is running.')+'</div>';
    return;
  }
  var counts={};day.races.forEach(function(r){counts[r.course]=(counts[r.course]||0)+1;});
  var courses=Object.keys(counts).sort();
  /* Each of the day's meetings gets its own planner colour (rarely more than eight in a day). */
  var colourOf=function(c){return 'var(--c'+(courses.indexOf(c)%8+1)+')';};
  if(course&&!counts[course])course=null;
  var up=day.updated?new Date(day.updated):null;
  $('#stat').textContent=day.races.length+' races · '+courses.length+' meeting'+(courses.length===1?'':'s')+
    (up?' · updated '+up.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'');

  $('#tray').hidden=courses.length<2;
  $('#chips').innerHTML='<button class="chip all" type="button" data-c="" aria-pressed="'+(!course)+'">All <em>'+day.races.length+'</em></button>'+
    courses.map(function(c){return '<button class="chip" type="button" data-c="'+esc(c)+'" style="--k:'+colourOf(c)+'" aria-pressed="'+(course===c)+'">'+esc(c)+' <em>'+counts[c]+'</em></button>';}).join('');

  // Today: races still to run come first, finished ones drop to the end.
  var now=cur===today?nowLondon():null;
  var shown=day.races.filter(function(r){return !course||r.course===course;});
  if(now)shown=shown.filter(function(r){return r.time>=now;}).concat(shown.filter(function(r){return r.time<now;}));
  box.innerHTML=shown.map(function(r){
    var gone=now&&r.time<now;
    return '<article class="race'+(gone?' gone':'')+'" style="--k:'+colourOf(r.course)+'">'+
      '<div class="rh"><b>'+esc(r.time)+'</b><span>'+esc(r.course)+'</span></div>'+
      '<ol>'+(r.picks||[]).slice(0,3).map(function(p,j){return '<li><i>'+(j+1)+'</i><span>'+esc(p)+'</span></li>';}).join('')+'</ol>'+
    '</article>';
  }).join('');
}

function show(k){
  cur=k;day=null;render();
  if(!k)return;
  getJSON('picks/'+k+'.json').then(function(d){if(cur===k){day=d;render();}}).catch(function(){if(cur===k)render();});
}

$('#prev').addEventListener('click',function(){var i=dates.indexOf(cur);if(i>0)show(dates[i-1]);});
$('#next').addEventListener('click',function(){var i=dates.indexOf(cur);if(i>=0&&i<dates.length-1)show(dates[i+1]);});
$('#today').addEventListener('click',function(){show(today);});
$('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;course=b.dataset.c||null;render();});

getJSON('picks/index.json').then(function(ix){
  dates=(ix&&ix.dates)||[];
  show(dates.indexOf(today)>=0?today:dates[dates.length-1]||null);
}).catch(function(){show(null);});
})();
</script>
</body>
</html>
